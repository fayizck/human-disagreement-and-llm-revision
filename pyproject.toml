[project]
name = "human-disagreement-and-llm-revision"
version = "1.0.0"
description = "Reproducibility materials for two studies of language-model judgment revision"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
